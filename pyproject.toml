[project]
name = "resume-builder"
version = "0.1.0"
description = "AI-powered resume tailoring with pay-per-run unlock"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "nicegui>=2.5.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.17",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.2",
    "weasyprint>=63.0",
    "boto3>=1.35.0",
    "stripe>=11.0.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "anthropic>=0.40.0",
    "bleach>=6.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "factory-boy>=3.3.0",
    "respx>=0.21.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "aiosqlite>=0.20.0",
    "types-passlib",
    "types-bleach",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "packages"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["apps", "packages"]
omit = [
    "tests/*",
    "migrations/*",
    "apps/web/ui/*",
    "apps/web/api/v1/webhooks/*",
    "packages/export/pdf_export.py",
    "packages/integrations/hf_inference.py",
    "packages/integrations/crypto/nowpayments.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy ORM uses string-based forward references in relationship() that
# ruff cannot resolve across modules — F821 false positives on all model files.
"packages/db/models/*.py" = ["F821"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# SQLAlchemy ORM forward references in relationship() are unresolvable by mypy
# without explicit TYPE_CHECKING imports. Disable strict checks for all model
# files; the runtime behaviour is correct (SQLAlchemy resolves lazily).
[[tool.mypy.overrides]]
module = [
    "packages.db.models.user",
    "packages.db.models.resume",
    "packages.db.models.agent_run",
    "packages.db.models.agent_run_event",
    "packages.db.models.payment",
    "packages.db.models.crypto_payment",
    "packages.db.models.crypto_webhook_event",
    "packages.db.models.device_session",
    "packages.db.models.export",
    "packages.db.models.stripe_event",
    "packages.db.models.refresh_token",
]
# SQLAlchemy ORM forward references in relationship() annotations are
# unresolvable by mypy without explicit TYPE_CHECKING guards. ignore_errors
# suppresses name-defined and type-arg false positives in these files.
ignore_errors = true

# Third-party integrations (boto3, stripe, nowpayments) ship untyped stubs.
# API route handlers intentionally omit return types (FastAPI infers from Response).
# Middleware helpers are internal glue with trivial signatures.
[[tool.mypy.overrides]]
module = [
    "packages.integrations.*",
    "packages.integrations.crypto.*",
    "packages.integrations.stripe_client",
    "packages.integrations.s3_storage",
    "packages.integrations.hf_inference",
    "packages.export.pdf_export",
    "packages.core.security.jwt",
    "packages.agent.graph",
    "packages.agent.nodes.*",
    "packages.agent.nodes.validate_output",
    "packages.agent.nodes.rewrite_sections",
    "packages.agent.nodes.format_output",
    "packages.agent.nodes.prepare_inputs",
    "apps.web.api.v1.auth",
    "apps.web.api.v1.billing",
    "apps.web.api.v1.exports",
    "apps.web.api.v1.health",
    "apps.web.api.v1.resumes",
    "apps.web.api.v1.runs",
    "apps.web.api.v1.webhooks.stripe",
    "apps.web.api.v1.webhooks.crypto",
    "apps.web.middleware.rate_limit",
    "apps.web.middleware.security_headers",
    "apps.web.ui.app",
    "apps.web.ui.auth_guard",
    "apps.web.ui.dashboard",
    "apps.web.main",
    "apps.web.services.run_executor",
]
ignore_errors = true
