name: Migration Doc Check

on:
  pull_request:
    branches: [develop, qa, main]
    paths:
      - 'migrations/**'
      - 'packages/db/models/**'
      - 'scripts/db/**'
      - 'docs/database/**'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify table docs are current
        run: |
          docker compose -f docker-compose.test.yml up -d postgres
          docker compose -f docker-compose.test.yml run --rm migrate
          docker compose -f docker-compose.test.yml run --rm -v "$PWD:/app" test bash -lc "git config --global --add safe.directory /app && scripts/db/verify_docs.sh"
